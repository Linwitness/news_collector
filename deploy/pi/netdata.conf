# Netdata on newspi: installed as /etc/netdata/netdata.conf by deploy/pi/setup.sh.
# Everything not set here keeps Netdata's default; see them with: netdatacli dumpconfig
[web]
    # Serve the dashboard only to the Pi itself and to Tailscale devices
    # (100.64.0.0/10, fd7a:115c:a1e0::/48), not to everything on the home network.
    allow connections from = localhost 127.0.0.1 ::1 100.* fd7a:115c:a1e0:*
    allow connections by dns = no
    allow netdata.conf from = localhost 127.0.0.1 ::1
